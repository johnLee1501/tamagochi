<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascota Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --pagina: #e6eaf3;
    --pagina-texto: #1e2440;
    --pagina-suave: #5b6385;
    --carcasa: #6fa8dc;
    --carcasa-luz: #a9cdee;
    --carcasa-sombra: #3f78ae;
    --carcasa-texto: #1e2440;
    --bisel: #1e2440;
    --lcd: #bac48f;
    --tinta: #2d3423;
    --alerta: #8a5a00;
    --peligro: #b3261e;
    --boton: #ffd447;
    --boton-sombra: #c79f1a;
    --fuente: "Press Start 2P", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --pagina: #12162a;
      --pagina-texto: #e6eaf3;
      --pagina-suave: #9aa3c4;
      --carcasa: #5b95cc;
      --carcasa-luz: #8fbbe4;
      --carcasa-sombra: #2f6296;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--pagina);
    color: var(--pagina-texto);
    font-family: var(--fuente);
  }

  .escena {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 24px 0;
  }

  /* Carcasa en forma de huevo: más angosta arriba, más ancha abajo */
  .dispositivo {
    width: min(360px, 94vw);
    aspect-ratio: 36 / 46;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    border-radius: 50% / 58% 58% 42% 42%;
    background: radial-gradient(ellipse at 32% 22%, var(--carcasa-luz) 0 12%, var(--carcasa) 42%, var(--carcasa-sombra) 100%);
    box-shadow:
      0 24px 40px -12px rgba(30, 36, 64, .45),
      inset 0 -14px 24px rgba(30, 36, 64, .25),
      inset 0 8px 16px rgba(255, 255, 255, .25);
  }

  .marca { font-size: 10px; color: var(--carcasa-texto); }

  .bisel {
    padding: 10px;
    border-radius: 16px;
    background: var(--bisel);
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, .6);
  }

  /* Pantalla LCD */
  .pantalla {
    position: relative;
    width: 232px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px;
    border-radius: 6px;
    background: var(--lcd);
    color: var(--tinta);
    box-shadow: inset 0 0 14px rgba(45, 52, 35, .35);
  }

  /* Capa que oscurece la pantalla al dormir */
  .noche {
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: inherit;
    background: var(--tinta);
    opacity: 0;
    pointer-events: none;
  }

  .barras { display: flex; flex-direction: column; gap: 6px; }
  .barra {
    display: grid;
    grid-template-columns: 64px 1fr 32px;
    align-items: center;
    gap: 6px;
    font-size: 7px;
  }
  .pista { height: 9px; padding: 1px; border: 2px solid var(--tinta); }
  .relleno {
    height: 100%;
    width: 100%;
    background: var(--tinta);
    transition: width .3s steps(3), background-color .2s;
  }
  .relleno.alerta { background: var(--alerta); }
  .relleno.peligro { background: var(--peligro); animation: parpadeo .8s steps(1) infinite; }
  .valor { text-align: right; }

  /* Mascota */
  .zona-mascota { position: relative; height: 112px; display: grid; place-items: end center; padding-bottom: 8px; }
  .paisaje {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 3px;
    image-rendering: pixelated;
  }
  /* Hora del ciclo de día y noche, en la esquina del paisaje */
  .reloj {
    position: absolute;
    left: 3px;
    top: 3px;
    padding: 2px 3px;
    font-size: 7px;
    line-height: 1;
    color: var(--tinta);
    background: rgba(186, 196, 143, .88);
    border-radius: 2px;
  }
  .paseo { position: relative; transition-property: transform; transition-timing-function: linear; }
  .cuerpo { position: relative; line-height: 1; user-select: none; font-size: 44px; transition: font-size .4s steps(4); }
  .cuerpo.etapa-1 { font-size: 76px; }
  .figura { display: inline-block; transform-origin: 50% 100%; scale: var(--direccion, 1) 1; }
  .sombra {
    position: absolute;
    left: 50%;
    bottom: -.04em;
    width: .8em;
    height: .14em;
    translate: -50% 0;
    border-radius: 50%;
    background: rgba(45, 52, 35, .25);
  }
  .cuerpo:not(.fase-vivo) .sombra { display: none; }

  /* Movimiento mientras vive: depende del ánimo, de si camina y de la especie */
  .cuerpo.fase-vivo .figura { animation: respirar 1.8s ease-in-out infinite; }
  .cuerpo.fase-vivo.animo-feliz .figura { animation: brincar 1.3s ease-in-out infinite; }
  .cuerpo.fase-vivo.animo-triste .figura { animation: suspirar 3s ease-in-out infinite; }
  .cuerpo.fase-vivo.caminando.especie-gato .figura { animation: andar-sigiloso .55s ease-in-out infinite; }
  .cuerpo.fase-vivo.caminando.especie-pollito .figura { animation: andar-saltitos .3s ease-in-out infinite; }
  .cuerpo.fase-vivo.caminando.especie-perro .figura { animation: andar-trote .35s ease-in-out infinite; }
  .cuerpo.fase-vivo.caminando.especie-dino .figura { animation: andar-pisoton .8s ease-in-out infinite; }
  .cuerpo.fase-vivo.durmiendo .figura { animation: roncar 1.6s ease-in-out infinite; }

  /* Comida, juguetes, Zzz, migas y corazones que salen alrededor de la mascota */
  .efectos { position: absolute; left: 50%; bottom: 0; z-index: 2; pointer-events: none; }
  .particula {
    position: absolute;
    left: 0;
    bottom: 0;
    translate: -50% 0;
    transform-origin: 50% 100%;
    font-size: 20px;
    line-height: 1;
    white-space: nowrap;
  }
  .particula.zzz { font-size: 10px; color: var(--tinta); }
  .particula.miga { font-size: 8px; color: var(--tinta); }
  .particula.grito { font-size: 8px; color: var(--tinta); }
  .luna { position: absolute; right: 10px; top: 52px; z-index: 2; font-size: 18px; opacity: 0; pointer-events: none; }

  .cuerpo.fase-huevo,
  .cuerpo.fase-eclosionando { font-size: 52px; transform-origin: 50% 90%; }
  .cuerpo.fase-huevo { animation: tambaleo 1.6s steps(1) infinite; }
  .cuerpo.fase-muerto { font-size: 52px; animation: flotar 2.4s ease-in-out infinite; }
  .corona {
    position: absolute;
    left: 50%;
    top: -.32em;
    translate: -50% 0;
    font-size: .4em;
  }

  /* Burbuja de ánimo para las especies que no cambian de cara */
  .animo {
    position: absolute;
    right: -.45em;
    top: -.1em;
    font-size: .32em;
  }

  /* Aviso de lo que la puede matar: una barra en peligro */
  .aviso {
    position: absolute;
    right: 100%;
    top: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 20px;
    animation: parpadeo .8s steps(1) infinite;
  }
  .aviso:empty { display: none; }

  /* Elección de personaje */
  .eleccion {
    position: relative;
    align-self: center;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    width: 100%;
  }
  .opcion {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    font: inherit;
    font-size: 7px;
    white-space: nowrap;
    color: var(--tinta);
    background: rgba(186, 196, 143, .88);
    border: 2px solid var(--tinta);
    cursor: pointer;
  }
  .opcion-emoji { font-size: 18px; line-height: 1; }
  .opcion:hover, .opcion:focus-visible { outline: none; background: var(--tinta); color: var(--lcd); }

  .estado { display: flex; justify-content: space-between; gap: 6px; font-size: 7px; }
  .turbo { margin-left: 6px; }

  /* Botones físicos */
  .controles { display: flex; gap: 14px; }
  .control {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    font: inherit;
    font-size: 8px;
    color: var(--carcasa-texto);
  }
  .perilla {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 20px;
    background: var(--boton);
    box-shadow: 0 4px 0 var(--boton-sombra), 0 7px 10px rgba(30, 36, 64, .3);
    transition: transform .06s, box-shadow .06s;
  }
  .control:active:not(:disabled) .perilla {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--boton-sombra), 0 2px 4px rgba(30, 36, 64, .3);
  }
  .control:focus-visible { outline: none; }
  .control:focus-visible .perilla { outline: 3px solid var(--bisel); outline-offset: 3px; }
  .control:disabled { cursor: not-allowed; opacity: .55; }
  .control:disabled .perilla { filter: grayscale(1); }

  .reiniciar {
    font: inherit;
    font-size: 10px;
    padding: 12px 18px;
    color: var(--pagina-texto);
    background: transparent;
    border: 3px solid var(--pagina-texto);
    box-shadow: 4px 4px 0 var(--pagina-texto);
    cursor: pointer;
  }
  .reiniciar:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--pagina-texto); }
  .reiniciar:focus-visible { outline: 3px solid var(--carcasa); outline-offset: 4px; }

  .ayuda {
    margin: 0;
    font-size: 8px;
    line-height: 1.8;
    color: var(--pagina-suave);
    text-align: center;
  }

  @keyframes parpadeo { 50% { opacity: .25; } }
  @keyframes respirar { 50% { transform: scale(1.04, .96); } }
  @keyframes brincar {
    0%, 55%, 100% { transform: translateY(0) scale(1, 1); }
    25% { transform: translateY(-7px) scale(.96, 1.05); }
    62% { transform: translateY(0) scale(1.08, .92); }
  }
  @keyframes suspirar {
    0%, 100% { transform: translateY(2px) scale(1.02, .94) rotate(-3deg); }
    50% { transform: translateY(3px) scale(1.05, .9) rotate(3deg); }
  }
  @keyframes andar-sigiloso {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-2px) rotate(3deg); }
  }
  @keyframes andar-saltitos {
    0%, 100% { transform: translateY(0) scale(1.06, .94); }
    50% { transform: translateY(-7px) scale(.96, 1.04); }
  }
  @keyframes andar-trote {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-4px) rotate(6deg); }
  }
  @keyframes andar-pisoton {
    0%, 100% { transform: translateY(0) rotate(-4deg) scale(1.05, .95); }
    25%, 75% { transform: translateY(-3px) rotate(0); }
    50% { transform: translateY(0) rotate(4deg) scale(1.05, .95); }
  }
  @keyframes roncar {
    0%, 100% { transform: translateY(4px) rotate(-14deg) scale(1, .9); }
    50% { transform: translateY(4px) rotate(-14deg) scale(1.05, .85); }
  }
  @keyframes flotar { 50% { transform: translateY(-10px); } }
  @keyframes tambaleo {
    25% { transform: rotate(-8deg); }
    50% { transform: rotate(0); }
    75% { transform: rotate(8deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cuerpo.fase-vivo .figura, .cuerpo.fase-huevo, .cuerpo.fase-muerto, .relleno.peligro, .aviso { animation: none !important; }
    .paseo { transition: none; }
  }
</style>
</head>
<body>
<div class="escena">
  <main class="dispositivo" aria-label="Mascota Virtual">
    <div class="marca">Mascota Virtual</div>

    <div class="bisel">
      <div class="pantalla" id="pantalla">
        <div class="barras">
          <div class="barra" data-stat="hambre">
            <span>Hambre</span>
            <div class="pista" role="progressbar" aria-label="Hambre" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="relleno"></div></div>
            <span class="valor">100%</span>
          </div>
          <div class="barra" data-stat="energia">
            <span>Energía</span>
            <div class="pista" role="progressbar" aria-label="Energía" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="relleno"></div></div>
            <span class="valor">100%</span>
          </div>
          <div class="barra" data-stat="diversion">
            <span>Diversión</span>
            <div class="pista" role="progressbar" aria-label="Diversión" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="relleno"></div></div>
            <span class="valor">100%</span>
          </div>
        </div>

        <div class="zona-mascota">
          <canvas class="paisaje" id="paisaje" width="106" height="56" aria-hidden="true"></canvas>
          <span class="reloj" id="reloj" aria-hidden="true">07:00</span>
          <div class="eleccion" id="eleccion" role="group" aria-label="Elige tu mascota"></div>
          <div class="paseo" id="paseo">
            <div class="cuerpo fase-huevo etapa-0" id="cuerpo">
              <span class="sombra" aria-hidden="true"></span>
              <span class="figura" id="figura"><span id="mascota">🥚</span></span>
              <span class="corona" id="corona" aria-hidden="true" hidden>👑</span>
              <span class="animo" id="animo" aria-hidden="true"></span>
              <span class="aviso" id="aviso" role="status"></span>
            </div>
            <div class="efectos" id="efectos" aria-hidden="true"></div>
          </div>
        </div>
        <span class="luna" id="luna" aria-hidden="true">🌙</span>

        <div class="estado">
          <span><span id="izquierda">Presiona un botón</span><span class="turbo" id="turbo" hidden>x10</span></span>
          <span id="derecha"></span>
        </div>

        <div class="noche" id="noche" aria-hidden="true"></div>
      </div>
    </div>

    <div class="controles">
      <button class="control" type="button" data-accion="alimentar"><span class="perilla" aria-hidden="true">🍖</span>Alimentar</button>
      <button class="control" type="button" data-accion="dormir"><span class="perilla" aria-hidden="true">💤</span>Dormir</button>
      <button class="control" type="button" data-accion="jugar"><span class="perilla" aria-hidden="true">⚽</span>Jugar</button>
    </div>
  </main>

  <button class="reiniciar" id="reiniciar" type="button" hidden>Reiniciar</button>
  <p class="ayuda">Teclas 1 a 4 para elegir mascota.<br>Teclas 1, 2 y 3 para cuidarla.<br><span id="ayuda-teclas">R reinicia. M silencia.</span></p>
</div>

    turbo: $('#turbo'),
    reiniciar: $('#reiniciar'),
    ayudaTeclas: $('#ayuda-teclas'),
    botones: document.querySelectorAll('[data-accion]'),
    barras: Object.fromEntries(BARRAS.map((nombre) => {
      const fila = $(`[data-stat="${nombre}"]`);
      return [nombre, {
        pista: fila.querySelector('.pista'),
        relleno: fila.querySelector('.relleno'),
        valor: fila.querySelector('.valor'),
      }];
    })),
  };

  /* ===== Animaciones (respetan "reducir movimiento" del sistema) ===== */
  const sinMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)');
  function animar(elemento, cuadros, opciones) {
    if (sinMovimiento.matches) return null;
    return elemento.animate(cuadros, opciones);
  }

  /* ===== Sonido con Web Audio, sin archivos ===== */
  let audio = null;
  let silencio = false;

  // El navegador solo permite sonido después de un clic o una tecla
  function despertarAudio() {
    const Contexto = window.AudioContext || window.webkitAudioContext;
    if (!Contexto) return;
    if (!audio) audio = new Contexto();
    if (audio.state === 'suspended') audio.resume();
  }

  function nota(frecuencia, inicio, duracion) {
    const t = audio.currentTime + inicio;
    const oscilador = audio.createOscillator();
    const volumen = audio.createGain();
    oscilador.type = 'square';
    oscilador.frequency.setValueAtTime(frecuencia, t);
    volumen.gain.setValueAtTime(0.05, t);
    volumen.gain.exponentialRampToValueAtTime(0.0001, t + duracion);
    oscilador.connect(volumen).connect(audio.destination);
    oscilador.start(t);
    oscilador.stop(t + duracion + 0.02);
  }

  function sonar(nombre) {
    if (silencio || !audio) return;
    for (const [frecuencia, inicio, duracion] of MELODIAS[nombre]) nota(frecuencia, inicio, duracion);
  }

  /* ===== Récord (si el navegador no deja guardar, dura solo la sesión) ===== */
  const CLAVE_RECORD = 'tamagotchi-record';
  function leerRecord() {
    try { return Number(localStorage.getItem(CLAVE_RECORD)) || 0; } catch { return 0; }
  }
  function guardarRecord(valor) {
    try { localStorage.setItem(CLAVE_RECORD, String(valor)); } catch { /* sin almacenamiento */ }
  }

  /* ===== Estado del juego ===== */
  let record = leerRecord();
  let estado;
  let turbo = false;
  let descuentoId = null;
  let relojId = null;
  let reaccionId = null;
  let rutinaId = null;
  let caminataId = null;
  let escenaIds = [];

  const limitar = (valor) => Math.max(0, Math.min(REGLAS.maximo, valor));
  const aleatorio = (minimo, maximo) => minimo + Math.random() * (maximo - minimo);

  function etapa() {
    let indice = 0;
    ETAPAS.forEach((e, i) => { if (estado.edad >= e.desde) indice = i; });
    return indice;
  }

  // fase: 'eleccion' -> 'huevo' -> 'eclosionando' -> 'vivo' -> 'muerto'
  function nuevaPartida() {
    detenerTemporizadores();
    detenerVidaLibre();
    clearTimeout(reaccionId);
    turbo = false;
    estado = {
      hambre: REGLAS.inicio,
      energia: REGLAS.inicio,
      diversion: REGLAS.inicio,
      fase: 'eleccion',
      especie: null,
      edad: 0,
      reaccion: null,
      nuevoRecord: false,
      x: 0,
      direccion: 1,
      caminando: false,
    };
    ui.paseo.style.transitionDuration = '0ms';
    ui.paseo.style.transform = '';
    ui.figura.style.setProperty('--direccion', 1);
    ui.efectos.replaceChildren();
    render();
    ui.eleccion.querySelector('.opcion').focus();
  }

  function elegirEspecie(indice) {
    if (estado.fase !== 'eleccion' || !ESPECIES[indice]) return;
    despertarAudio();
    estado.especie = ESPECIES[indice];
    estado.fase = 'huevo';
    sonar('alimentar');
    render();
  }

  function formaActual() {
    return estado.especie.etapas[etapa()];
  }

  async function eclosionar() {
    if (estado.fase !== 'huevo') return;
    const partida = estado;
    partida.fase = 'eclosionando';
    render();
    const sacudida = animar(ui.cuerpo, [
      { transform: 'rotate(0)' },
      { transform: 'rotate(-14deg)' },
      { transform: 'rotate(14deg)' },
      { transform: 'rotate(-14deg)' },
      { transform: 'rotate(14deg)' },
      { transform: 'rotate(0) scale(1.15)' },
    ], { duration: 900, easing: 'steps(10)' });
    if (sacudida) await sacudida.finished.catch(() => {});
    if (estado !== partida || partida.fase !== 'eclosionando') return;

    partida.fase = 'vivo';
    sonar('eclosion');
    programarTemporizadores();
    programarRutina();
    render();
    animar(ui.cuerpo, [
      { transform: 'scale(.4)' },
      { transform: 'scale(1.2)' },
      { transform: 'scale(1)' },
    ], { duration: 350, easing: 'steps(4)' });
  }

  /* ===== Temporizadores ===== */
  function programarTemporizadores() {
    detenerTemporizadores();
    const velocidad = turbo ? TURBO : 1;
    descuentoId = setInterval(descontar, REGLAS.cadaMs / velocidad);
    relojId = setInterval(envejecer, 1000 / velocidad);
  }

  function detenerTemporizadores() {
    clearInterval(descuentoId);
    clearInterval(relojId);
  }

  function descontar() {
    let entroEnPeligro = false;
    for (const nombre of BARRAS) {
      const antes = estado[nombre];
      estado[nombre] = limitar(antes - REGLAS.descuento);
      if (antes > UMBRAL.peligro && estado[nombre] <= UMBRAL.peligro) entroEnPeligro = true;
    }
    if (BARRAS.some((nombre) => estado[nombre] === 0)) morir();
    else if (entroEnPeligro) sonar('alarma');
    render();
    if (estado.fase === 'muerto') ui.reiniciar.focus();
  }

  function envejecer() {
    const antes = etapa();
    estado.edad += 1;
    if (etapa() > antes) evolucionar();
    render();
  }

  /* ===== Acciones ===== */
  function actuar(accion) {
    despertarAudio();
    if (estado.fase === 'eleccion') return;
    if (estado.fase === 'huevo') { eclosionar(); return; }
    if (estado.fase !== 'vivo') return;
    const nombre = ACCIONES[accion];
    estado[nombre] = limitar(estado[nombre] + REGLAS.aumento);
    sonar(accion);
    reaccionar(accion);
    render();
  }

  function reaccionar(accion) {
    detenerCaminata();
    cancelarEscena();
    estado.reaccion = accion;
    const { duracion } = REACCIONES[accion];
    clearTimeout(reaccionId);
    reaccionId = setTimeout(() => { estado.reaccion = null; render(); }, duracion);
    ESCENAS[accion](duracion);
  }

  /* ===== Vida libre: camina, mira a donde va y hace gestos de su especie ===== */
  function tamanoMascota() {
    return parseFloat(getComputedStyle(ui.cuerpo).fontSize);
  }

  // direccion 1 = mira hacia la izquierda (como se dibuja el emoji); -1 = hacia la derecha
  function mirarHacia(direccion) {
    estado.direccion = direccion;
    ui.figura.style.setProperty('--direccion', direccion);
  }

  // Distancia horizontal hacia donde mira la mascota
  function alFrente(distancia) {
    return -estado.direccion * distancia;
  }

  function moverA(x, duracion) {
    ui.paseo.style.transitionDuration = `${duracion}ms`;
    ui.paseo.style.transform = `translateX(${x}px)`;
    estado.x = x;
  }

  function limiteDeZona() {
    return Math.max(0, (ui.zona.clientWidth - tamanoMascota()) / 2 - RUTINA.margen);
  }

  function caminar() {
    const limite = limiteDeZona();
    const cercano = aleatorio(-limite, limite);
    const destino = Math.abs(cercano - estado.x) >= RUTINA.distanciaMinima
      ? cercano
      : -Math.sign(estado.x || 1) * limite * aleatorio(RUTINA.recorridoMinimo, 1);
    const distancia = Math.abs(destino - estado.x);
    if (distancia < RUTINA.distanciaMinima) return;
    const lento = animoActual() === 'triste' ? .5 : 1;
    const duracion = distancia / (estado.especie.velocidad * lento) * 1000;
    mirarHacia(destino > estado.x ? -1 : 1);
    moverA(destino, duracion);
    estado.caminando = true;
    render();
    clearTimeout(caminataId);
    caminataId = setTimeout(() => { estado.caminando = false; render(); }, duracion);
  }

  function detenerCaminata() {
    clearTimeout(caminataId);
    if (!estado.caminando) return;
    const transformacion = getComputedStyle(ui.paseo).transform;
    moverA(transformacion === 'none' ? 0 : new DOMMatrixReadOnly(transformacion).m41, 0);
    estado.caminando = false;
  }

  function acomodarEnZona() {
    if (estado.fase !== 'vivo') return;
    const limite = limiteDeZona();
    if (Math.abs(estado.x) > limite) moverA(Math.sign(estado.x) * limite, 400);
  }

  function hacerGesto() {
    const { gesto } = estado.especie;
    animar(ui.figura, GESTOS[gesto].cuadros, { duration: GESTOS[gesto].duracion, easing: 'ease-in-out' });
    if (EXTRAS_GESTO[gesto]) EXTRAS_GESTO[gesto]();
  }

  function rutina() {
    if (estado.fase !== 'vivo') return;
    if (!estado.reaccion && !estado.caminando) {
      const enPeligro = barrasEnPeligro().length > 0;
      if (!enPeligro && Math.random() < RUTINA.probabilidadGesto) hacerGesto();
      else if (!enPeligro || Math.random() < RUTINA.probabilidadGesto) caminar();
    }
    programarRutina();
  }

  function programarRutina() {
    clearTimeout(rutinaId);
    rutinaId = setTimeout(rutina, aleatorio(RUTINA.minimoMs, RUTINA.maximoMs));
  }

  function enEscena(ms, accion) {
    escenaIds.push(setTimeout(accion, ms));
  }

  function cancelarEscena() {
    escenaIds.forEach(clearTimeout);
    escenaIds = [];
    ui.figura.getAnimations().filter((a) => !(a instanceof CSSAnimation)).forEach((a) => a.cancel());
  }

  function detenerVidaLibre() {
    clearTimeout(rutinaId);
    clearTimeout(caminataId);
    escenaIds.forEach(clearTimeout);
    escenaIds = [];
  }

  /* ===== Partículas: comida, juguetes, Zzz, migas, corazones ===== */
  function particula(texto, cuadros, duracion, clase = '') {
    if (sinMovimiento.matches) return;
    const elemento = document.createElement('span');
    elemento.className = `particula ${clase}`;
    elemento.textContent = texto;
    ui.efectos.appendChild(elemento);
    elemento.animate(cuadros, { duration: duracion, fill: 'forwards' }).finished
      .catch(() => {})
      .then(() => elemento.remove());
  }

  function migas(x, cantidad) {
    for (let i = 0; i < cantidad; i += 1) {
      const salto = aleatorio(-16, 16);
      particula('•', [
        { transform: `translate(${x}px, -6px)`, opacity: 1 },
        { transform: `translate(${x + salto}px, ${-aleatorio(12, 22)}px)`, opacity: 1, offset: .4 },
        { transform: `translate(${x + salto * 1.6}px, 0)`, opacity: 0 },
      ], 550, 'miga');
    }
  }

  function subirDesdeLaCabeza(texto, clase = '') {
    const alto = tamanoMascota();
    particula(texto, [
      { transform: `translate(0, ${-alto}px) scale(.5)`, opacity: 0 },
      { transform: `translate(0, ${-alto - 10}px) scale(1)`, opacity: 1, offset: .3 },
      { transform: `translate(0, ${-alto - 30}px) scale(1)`, opacity: 0 },
    ], 900, clase);
  }

  function chispas() {
    const alto = tamanoMascota();
    [-1, 0, 1].forEach((lado) => {
      particula('✨', [
        { transform: `translate(0, ${-alto * .6}px) scale(.3)`, opacity: 1 },
        { transform: `translate(${lado * 28}px, ${-alto - 12}px) scale(1)`, opacity: 0 },
      ], 700);
    });
  }

  const EXTRAS_GESTO = {
    picotear: () => {
      const x = alFrente(tamanoMascota() / 2);
      enEscena(GESTOS.picotear.duracion * .2, () => migas(x, 2));
      enEscena(GESTOS.picotear.duracion * .6, () => migas(x, 2));
    },
    rugir: () => {
      enEscena(GESTOS.rugir.duracion * .3, () => {
        subirDesdeLaCabeza('¡GRR!', 'grito');
        animar(ui.pantalla, [0, -2, 2, -2, 2, 0].map((x) => ({ transform: `translate(${x}px, ${-x / 2}px)` })), { duration: 400 });
      });
    },
    menear: () => subirDesdeLaCabeza('💕'),
  };

  /* ===== Escenas de cuidado ===== */
  const ESCENAS = {
    // La comida cae frente a la mascota, rebota y se la come a mordiscos
    alimentar: (duracion) => {
      const x = alFrente(tamanoMascota() / 2 + 10);
      const en = (y, escala) => `translate(${x}px, ${y}px) scale(${escala})`;
      particula(estado.especie.comida, [
        { transform: en(-70, 1), opacity: 0 },
        { transform: en(-60, 1), opacity: 1, offset: .05, easing: 'ease-in' },
        { transform: en(0, 1), offset: .22, easing: 'ease-out' },
        { transform: en(-8, 1), offset: .28, easing: 'ease-in' },
        { transform: en(0, 1), offset: .34 },
        { transform: en(0, .7), offset: .48 },
        { transform: en(0, .4), offset: .64 },
        { transform: en(0, .15), offset: .8 },
        { transform: en(0, 0), opacity: 0, offset: .9 },
        { transform: en(0, 0), opacity: 0 },
      ], duracion);
      const mordida = 'rotate(-14deg) translateY(3px) scale(1.08, .92)';
      animar(ui.figura, [
        { transform: 'rotate(0)' },
        { transform: 'rotate(0)', offset: .3 },
        { transform: mordida, offset: .4 },
        { transform: 'rotate(-6deg)', offset: .48 },
        { transform: mordida, offset: .56 },
        { transform: 'rotate(-6deg)', offset: .64 },
        { transform: mordida, offset: .72 },
        { transform: 'rotate(-6deg)', offset: .8 },
        { transform: 'rotate(0)', offset: .9 },
        { transform: 'rotate(0)' },
      ], { duration: duracion, easing: 'ease-in-out' });
      [.42, .58, .74].forEach((momento) => enEscena(duracion * momento, () => migas(x, 3)));
      enEscena(duracion * .88, () => subirDesdeLaCabeza('❤️'));
    },

    // Se acuesta, oscurece la pantalla, sale la luna y ronca soltando Zzz
    dormir: (duracion) => {
      animar(ui.noche, [{ opacity: 0 }, { opacity: .55, offset: .12 }, { opacity: .55, offset: .88 }, { opacity: 0 }], { duration: duracion, easing: 'ease-in-out' });
      animar(ui.luna, [
        { opacity: 0, transform: 'translateY(6px)' },
        { opacity: 1, transform: 'translateY(0)', offset: .15 },
        { opacity: 1, transform: 'translateY(0)', offset: .85 },
        { opacity: 0, transform: 'translateY(6px)' },
      ], { duration: duracion });
      const alto = tamanoMascota();
      [.08, .3, .52, .74].forEach((momento, indice) => enEscena(duracion * momento, () => {
        particula(indice % 2 ? 'Z' : 'z', [
          { transform: `translate(${alto * .3}px, ${-alto * .7}px) scale(.6)`, opacity: 0 },
          { transform: `translate(${alto * .3 + 10}px, ${-alto * .7 - 14}px) scale(1.1)`, opacity: 1, offset: .4 },
          { transform: `translate(${alto * .3 + 24}px, ${-alto * .7 - 34}px) scale(1.6)`, opacity: 0 },
        ], 1400, 'zzz');
      }));
    },

    // El juguete vuela en arco por encima; la mascota salta, se voltea para seguirlo y celebra
    jugar: (duracion) => {
      const vuelo = duracion * .85;
      const desde = alFrente(tamanoMascota() / 2 + 16);
      const altura = tamanoMascota() + 14;
      const PUNTOS_POR_ARCO = 8;
      const cuadros = [];
      [[desde, -desde], [-desde, desde]].forEach(([inicio, fin], arco) => {
        for (let i = 0; i <= PUNTOS_POR_ARCO; i += 1) {
          const t = i / PUNTOS_POR_ARCO;
          const x = inicio + (fin - inicio) * t;
          const y = -4 * altura * t * (1 - t);
          cuadros.push({ transform: `translate(${x}px, ${y}px) rotate(${(arco + t) * 360}deg)`, opacity: 1, offset: (arco + t) / 2 * .95 });
        }
      });
      cuadros.push({ transform: `translate(${desde}px, 0) rotate(720deg)`, opacity: 0, offset: 1 });
      particula(estado.especie.juguete, cuadros, vuelo);
      const agachado = 'translateY(0) scale(1.08, .92)';
      const salto = 'translateY(-16px) scale(.95, 1.06)';
      animar(ui.figura, [
        { transform: 'translateY(0)' },
        { transform: agachado, offset: .14 },
        { transform: salto, offset: .24 },
        { transform: agachado, offset: .36 },
        { transform: 'translateY(0)', offset: .5 },
        { transform: agachado, offset: .64 },
        { transform: salto, offset: .74 },
        { transform: agachado, offset: .86 },
        { transform: 'translateY(0)' },
      ], { duration: vuelo, easing: 'ease-in-out' });
      [.24, .74].forEach((momento) => enEscena(vuelo * momento, () => mirarHacia(-estado.direccion)));
      enEscena(vuelo, chispas);
    },
  };

  function evolucionar() {
    sonar('evolucion');
    animar(ui.cuerpo, [
      { transform: 'scale(1) rotate(0)' },
      { transform: 'scale(1.3) rotate(180deg)' },
      { transform: 'scale(1) rotate(360deg)' },
    ], { duration: 700, easing: 'steps(8)' });
    setTimeout(acomodarEnZona, 500);
  }

  function morir() {
    detenerCaminata();
    detenerVidaLibre();
    estado.fase = 'muerto';
    estado.reaccion = null;
    detenerTemporizadores();
    clearTimeout(reaccionId);
    if (estado.edad > record) {
      record = estado.edad;
      estado.nuevoRecord = true;
      guardarRecord(record);
    }
    sonar('muerte');
    animar(ui.pantalla, [
      { filter: 'invert(0)' },
      { filter: 'invert(1)' },
      { filter: 'invert(0)' },
      { filter: 'invert(1)' },
      { filter: 'invert(0)' },
    ], { duration: 700, easing: 'steps(4)' });
  }

  function reiniciar() {
    despertarAudio();
    nuevaPartida();
  }

  /* ===== Dibujo ===== */
  function animoActual() {
    if (estado.reaccion) return estado.reaccion;
    const minimo = Math.min(...BARRAS.map((nombre) => estado[nombre]));
    if (minimo > UMBRAL_ANIMO.feliz) return 'feliz';
    if (minimo > UMBRAL_ANIMO.triste) return 'normal';
    return 'triste';
  }

  function cara() {
    if (estado.fase === 'eleccion' || estado.fase === 'huevo' || estado.fase === 'eclosionando') return CARAS.huevo;
    if (estado.fase === 'muerto') return CARAS.muerta;
    const { emoji, caras } = formaActual();
    return caras ? caras[animoActual()] : emoji;
  }

  function burbujaAnimo() {
    if (estado.fase !== 'vivo' || formaActual().caras) return '';
    return estado.reaccion ? REACCIONES[estado.reaccion].burbuja : ANIMOS[animoActual()];
  }

  // Las barras en peligro, de la más baja a la más alta
  function barrasEnPeligro() {
    if (estado.fase !== 'vivo') return [];
    return BARRAS
      .filter((nombre) => estado[nombre] <= UMBRAL.peligro)
      .sort((a, b) => estado[a] - estado[b]);
  }

  function dibujarAviso() {
    const enPeligro = barrasEnPeligro();
    ui.aviso.replaceChildren(...enPeligro.map((nombre) => {
      const emoji = document.createElement('span');
      emoji.textContent = AVISOS_PELIGRO[nombre].emoji;
      return emoji;
    }));
    ui.aviso.setAttribute('aria-label', enPeligro.map((nombre) => AVISOS_PELIGRO[nombre].texto).join(', '));
  }

  function dibujarEleccion() {
    ui.eleccion.innerHTML = '';
    ESPECIES.forEach((especie, indice) => {
      const opcion = document.createElement('button');
      opcion.type = 'button';
      opcion.className = 'opcion';
      opcion.innerHTML = `<span class="opcion-emoji" aria-hidden="true">${especie.etapas[0].emoji}</span>${indice + 1} ${especie.nombre}`;
      opcion.addEventListener('click', () => elegirEspecie(indice));
      ui.eleccion.appendChild(opcion);
    });
  }

  function render() {
    for (const nombre of BARRAS) {
      const valor = estado[nombre];
      const { pista, relleno, valor: texto } = ui.barras[nombre];
      relleno.style.width = `${valor}%`;
      relleno.classList.toggle('alerta', valor <= UMBRAL.alerta && valor > UMBRAL.peligro);
      relleno.classList.toggle('peligro', valor <= UMBRAL.peligro);
      texto.textContent = `${valor}%`;
      pista.setAttribute('aria-valuenow', valor);
    }

    const { fase } = estado;
    const vivo = fase === 'vivo';
    const eligiendo = fase === 'eleccion';
    const nivel = etapa();

    ui.eleccion.hidden = !eligiendo;
    ui.paseo.hidden = eligiendo;
    ui.mascota.textContent = cara();
    ui.animo.textContent = burbujaAnimo();
    dibujarAviso();
    const clases = ['cuerpo', `fase-${fase}`, `etapa-${nivel}`];
    if (estado.especie) clases.push(`especie-${estado.especie.clave}`);
    if (vivo) clases.push(`animo-${animoActual()}`);
    if (estado.caminando) clases.push('caminando');
    if (estado.reaccion === 'dormir') clases.push('durmiendo');
    ui.cuerpo.className = clases.join(' ');
    ui.corona.hidden = !(vivo && nivel === ETAPAS.length - 1);
    ui.botones.forEach((boton) => { boton.disabled = fase === 'muerto' || eligiendo; });
    ui.reiniciar.hidden = fase !== 'muerto';
    ui.turbo.hidden = !(turbo && vivo);

    if (eligiendo) {
      ui.izquierda.textContent = 'Elige tu mascota';
      ui.derecha.textContent = record ? `Récord ${record} s` : '';
    } else if (vivo) {
      ui.izquierda.textContent = `Edad ${estado.edad} s`;
      ui.derecha.textContent = `${formaActual().nombre} · ${ETAPAS[nivel].nombre}`;
    } else if (fase === 'muerto') {
      ui.izquierda.textContent = `Vivió ${estado.edad} s`;
      ui.derecha.textContent = estado.nuevoRecord ? '¡Récord!' : `Récord ${record} s`;
    } else {
      ui.izquierda.textContent = 'Presiona un botón';
      ui.derecha.textContent = record ? `Récord ${record} s` : '';
    }

    ui.ayudaTeclas.textContent = silencio ? 'R reinicia. M activa el sonido.' : 'R reinicia. M silencia.';
  }

  /* ===== Paisaje pixelado de fondo: cielo, sol, nubes, montañas, pasto y una ceiba =====
     Tiene ciclo de día y noche (decorativo: no toca las reglas). */
  const ESCENARIO = { horizonte: 40, cuadroMs: 125 };
  // Colores de día. De noche y al atardecer se tiñen con iluminar().
  const COLORES_PAISAJE = {
    sol: '#ffd447',
    bordeSol: '#ffb300',
    nube: '#ffffff',
    sombraNube: '#d9e6f0',
    montana: '#8ea8c3',
    sombraMontana: '#7b93ad',
    nieve: '#f4f8fb',
    colina: '#6aa35a',
    sombraColina: '#5b8f4d',
    pasto: '#7cc04f',
    bordePasto: '#8fd15e',
    pastoOscuro: '#69a843',
    tierra: '#5f9a3c',
    piedra: '#9e9e9e',
    luzPiedra: '#c2c2c2',
    tallo: '#4f8a35',
    tronco: '#9a9178',
    luzTronco: '#b3ab90',
    sombraTronco: '#7d765f',
    rama: '#7d765f',
    copa: '#4e9a3a',
    luzCopa: '#6cbf4a',
    sombraCopa: '#3b7a2c',
    algodon: '#ffffff',
    ave: '#37474f',
  };
  const MONTANAS = [
    { centro: 36, alto: 16, base: 40, nieve: 3 },
    { centro: 62, alto: 23, base: 52, nieve: 4 },
    { centro: 88, alto: 18, base: 44, nieve: 3 },
  ];
  const COLINAS = [
    { centro: 24, alto: 8, base: 56 },
    { centro: 80, alto: 10, base: 64 },
  ];
  const NUBES = [
    { x: 10, y: 5, velocidad: .12, forma: ['..XXX...', '.XXXXXX.', 'XXXXXXXX'] },
    { x: 60, y: 13, velocidad: .07, forma: ['.XXX..', 'XXXXXX'] },
    { x: 95, y: 3, velocidad: .09, forma: ['...XX...', '.XXXXXX.', 'XXXXXXXXX'] },
  ];
  const FLORES = [[32, 47, '#ff6b6b'], [44, 51, '#ffd447'], [66, 46, '#ff9ff3'], [92, 49, '#ff6b6b'], [56, 53, '#ffffff'], [101, 44, '#ffd447']];
  const PIEDRAS = [[78, 51], [8, 53], [48, 44]];
  const CEIBA = { x: 16, copaY: 7, troncoArriba: 14 };

  // Franjas del cielo, de arriba hacia el horizonte, en cada momento del día
  const CIELOS = {
    dia: ['#7ec8ef', '#9dd6f2', '#bfe4f4', '#dcefe9'],
    ocaso: ['#3b3f8c', '#8d4f8f', '#e0785a', '#ffc27a'],
    noche: ['#0b1030', '#141b4d', '#1f2a63', '#2b3a72'],
  };
  const LUNA = { color: '#f3efd6', crater: '#cfc8a5' };
  const LUCIERNAGA = '#fff27a';
  const TINTE_NOCHE = [16, 22, 52];
  const TINTE_OCASO = [255, 120, 60];

  const DIA = {
    duracionMs: 120000, // un día completo dura 2 minutos reales
    horaInicial: 7,     // arranca de mañana
    orbitaX: 44,        // px del canvas: qué tan lejos del centro salen y se ponen el sol y la luna
    orbitaY: 32,        // px del canvas: qué tan alto suben
    pasosDeLuz: 16,     // la luz cambia por escalones, como en los juegos de 8 bits
  };

  let pincel = ui.paisaje.getContext('2d');
  const anchoPaisaje = ui.paisaje.width;
  const altoPaisaje = ui.paisaje.height;
  let cuadroPaisaje = 0;
  let hora = DIA.horaInicial;
  let ultimoTic = performance.now();
  let relojMostrado = '';

  // Lo que no se mueve (cielo y tierra) se pinta en capas aparte, una sola vez por cada tono de luz
  const crearCapa = () => Object.assign(document.createElement('canvas'), { width: anchoPaisaje, height: altoPaisaje });
  const capaCielo = crearCapa();
  const capaTierra = crearCapa();
  let paleta = null;
  let clavePaleta = '';

  const aRgb = (hex) => [1, 3, 5].map((i) => Number.parseInt(hex.slice(i, i + 2), 16));
  const aHex = (rgb) => `#${rgb.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('')}`;
  const mezclar = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

  // Pasa suavemente de 0 a 1 mientras x va de a hasta b
  function suavizar(a, b, x) {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  // Oscurece un color hacia el azul de la noche y lo calienta al atardecer
  function iluminar(hex, luz, ocaso) {
    const base = aRgb(hex);
    const nocturno = mezclar(base, TINTE_NOCHE, .75);
    return aHex(mezclar(mezclar(nocturno, base, luz), TINTE_OCASO, ocaso * .2));
  }

  // luz: 0 de noche, 1 de día. ocaso: 1 cuando el sol toca el horizonte.
  function luzDelDia() {
    const angulo = (hora - 12) / 24 * 2 * Math.PI;
    const altura = Math.cos(angulo); // 1 a mediodía, 0 al amanecer y al ocaso, -1 a medianoche
    const escalon = (valor) => Math.round(valor * DIA.pasosDeLuz) / DIA.pasosDeLuz;
    return {
      altura,
      lado: Math.sin(angulo), // el sol sale por la izquierda y se pone por la derecha
      luz: escalon(suavizar(-0.2, 0.25, altura)),
      ocaso: escalon(1 - suavizar(0, 0.35, Math.abs(altura))),
    };
  }

  function calcularPaleta(luz, ocaso) {
    const colores = {};
    for (const [nombre, color] of Object.entries(COLORES_PAISAJE)) colores[nombre] = iluminar(color, luz, ocaso);
    colores.cielo = CIELOS.dia.map((dia, i) => {
      const conLuz = mezclar(aRgb(CIELOS.noche[i]), aRgb(dia), luz);
      return aHex(mezclar(conLuz, aRgb(CIELOS.ocaso[i]), ocaso));
    });
    colores.flores = FLORES.map(([, , color]) => iluminar(color, luz, ocaso));
    // El sol no se oscurece: se pone naranja cerca del horizonte
    colores.sol = aHex(mezclar(aRgb(COLORES_PAISAJE.sol), [255, 140, 60], ocaso));
    colores.bordeSol = aHex(mezclar(aRgb(COLORES_PAISAJE.bordeSol), [230, 80, 40], ocaso));
    return colores;
  }

  // Dibuja en otra capa reutilizando las mismas funciones de pintura
  function pintarEn(capa, dibujo) {
    const principal = pincel;
    pincel = capa.getContext('2d');
    pincel.clearRect(0, 0, anchoPaisaje, altoPaisaje);
    dibujo();
    pincel = principal;
  }

  function actualizarPaleta(luz, ocaso) {
    const clave = `${luz}|${ocaso}`;
    if (clave === clavePaleta) return;
    clavePaleta = clave;
    paleta = calcularPaleta(luz, ocaso);
    pintarEn(capaCielo, dibujarCielo);
    pintarEn(capaTierra, () => {
      dibujarRelieve(MONTANAS, paleta.montana, paleta.sombraMontana, true);
      dibujarRelieve(COLINAS, paleta.colina, paleta.sombraColina, false);
      dibujarSuelo();
      dibujarCeiba();
    });
  }

  function punto(x, y, color) {
    pincel.fillStyle = color;
    pincel.fillRect(Math.round(x), Math.round(y), 1, 1);
  }

  function linea(x0, y0, x1, y1, color) {
    const pasos = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
    for (let i = 0; i <= pasos; i += 1) {
      punto(x0 + (x1 - x0) * i / pasos, y0 + (y1 - y0) * i / pasos, color);
    }
  }

  function elipse(cx, cy, a, b, colorDe) {
    for (let y = Math.floor(cy - b); y <= cy + b; y += 1) {
      for (let x = Math.floor(cx - a); x <= cx + a; x += 1) {
        if (((x - cx) / a) ** 2 + ((y - cy) / b) ** 2 <= 1) punto(x, y, colorDe(x, y));
      }
    }
  }

  function dibujarCielo() {
    const { cielo } = paleta;
    const altoBanda = ESCENARIO.horizonte / cielo.length;
    for (let y = 0; y < ESCENARIO.horizonte; y += 1) {
      const banda = Math.floor(y / altoBanda);
      const borde = y % altoBanda === altoBanda - 1 && banda < cielo.length - 1;
      for (let x = 0; x < anchoPaisaje; x += 1) {
        punto(x, y, borde && (x + y) % 2 === 0 ? cielo[banda + 1] : cielo[banda]);
      }
    }
  }

  // El sol y la luna recorren el mismo arco, en lados opuestos
  function posicionEnArco(altura, lado) {
    return {
      cx: Math.round(anchoPaisaje / 2 + DIA.orbitaX * lado),
      cy: Math.round(ESCENARIO.horizonte - DIA.orbitaY * altura),
    };
  }

  function dibujarSol(cuadro, altura, lado) {
    const { cx, cy } = posicionEnArco(altura, lado);
    const radio = 5;
    if (cy > ESCENARIO.horizonte + radio + 4) return; // ya se escondió
    elipse(cx, cy, radio, radio, (x, y) => (Math.hypot(x - cx, y - cy) > radio - 1 ? paleta.bordeSol : paleta.sol));
    const largo = cuadro % 8 < 4 ? 2 : 3;
    for (let i = 0; i < 8; i += 1) {
      const angulo = i * Math.PI / 4;
      for (let d = radio + 2; d < radio + 2 + largo; d += 1) {
        punto(cx + Math.cos(angulo) * d, cy + Math.sin(angulo) * d, paleta.sol);
      }
    }
  }

  function dibujarLuna(altura, lado) {
    const { cx, cy } = posicionEnArco(-altura, -lado);
    const radio = 4;
    if (cy > ESCENARIO.horizonte + radio) return;
    elipse(cx, cy, radio, radio, () => LUNA.color);
    [[-1, -1], [1, 1], [2, -1]].forEach(([dx, dy]) => punto(cx + dx, cy + dy, LUNA.crater));
  }

  function dibujarNubes(cuadro) {
    NUBES.forEach(({ x, y, velocidad, forma }) => {
      const recorrido = anchoPaisaje + forma[0].length * 2;
      const inicio = ((x + cuadro * velocidad) % recorrido) - forma[0].length;
      forma.forEach((fila, dy) => {
        [...fila].forEach((celda, dx) => {
          if (celda === 'X') punto(inicio + dx, y + dy, dy === forma.length - 1 ? paleta.sombraNube : paleta.nube);
        });
      });
    });
  }

  function dibujarRelieve(cerros, color, sombra, nieve) {
    cerros.forEach((cerro) => {
      const mitad = cerro.base / 2;
      for (let x = Math.ceil(cerro.centro - mitad); x <= cerro.centro + mitad; x += 1) {
        const alto = Math.round(cerro.alto * (1 - Math.abs(x - cerro.centro) / mitad)) + (x % 3 === 0 ? 1 : 0);
        for (let h = 0; h < alto; h += 1) {
          const y = ESCENARIO.horizonte - 1 - h;
          const nevado = nieve && h >= alto - cerro.nieve;
          punto(x, y, nevado ? paleta.nieve : (x > cerro.centro ? sombra : color));
        }
      }
    });
  }

  function dibujarSuelo() {
    const c = paleta;
    for (let y = ESCENARIO.horizonte; y < altoPaisaje; y += 1) {
      for (let x = 0; x < anchoPaisaje; x += 1) {
        let color = c.pasto;
        if (y < ESCENARIO.horizonte + 2) color = c.bordePasto;
        else if (y >= altoPaisaje - 4) color = c.tierra;
        else if ((x * 3 + y * 5) % 11 === 0) color = c.pastoOscuro;
        punto(x, y, color);
      }
    }
    PIEDRAS.forEach(([x, y]) => {
      linea(x, y, x + 2, y, c.luzPiedra);
      linea(x - 1, y + 1, x + 3, y + 1, c.piedra);
    });
    FLORES.forEach(([x, y], indice) => {
      punto(x, y + 1, c.tallo);
      punto(x, y, c.flores[indice]);
    });
  }

  // Ceiba: tronco gris recto con raíces de contrafuerte, ramas horizontales y copa ancha en forma de sombrilla
  function dibujarCeiba() {
    const c = paleta;
    const { x: cx, copaY, troncoArriba } = CEIBA;
    const suelo = ESCENARIO.horizonte + 1;
    const inicioRaices = suelo - 6;
    for (let y = troncoArriba; y <= suelo; y += 1) {
      const mitad = y < inicioRaices ? 2 : 2 + (y - inicioRaices + 1);
      for (let x = cx - mitad; x <= cx + mitad; x += 1) {
        let color = c.tronco;
        if (x === cx - 1) color = c.luzTronco;
        if (x >= cx + 2) color = c.sombraTronco;
        if (y >= inicioRaices && Math.abs(x - cx) > 2 && (x - cx) % 2 === 0) color = c.sombraTronco;
        punto(x, y, color);
      }
    }
    [[troncoArriba + 6, -1], [troncoArriba + 13, 1]].forEach(([y, lado]) => punto(cx + lado * 2, y, c.sombraTronco));
    linea(cx - 1, troncoArriba + 2, cx - 11, copaY + 4, c.rama);
    linea(cx + 1, troncoArriba + 2, cx + 11, copaY + 4, c.rama);
    linea(cx - 1, troncoArriba + 3, cx - 7, copaY + 5, c.rama);
    linea(cx, troncoArriba, cx, copaY + 2, c.rama);
    const colorCopa = (centroY) => (x, y) => {
      if (y >= centroY + 2) return c.sombraCopa;
      if (y <= centroY - 2 || (x * 5 + y * 3) % 7 === 0) return c.luzCopa;
      return c.copa;
    };
    elipse(cx - 9, copaY + 3, 7, 2.5, colorCopa(copaY + 3));
    elipse(cx + 9, copaY + 3, 7, 2.5, colorCopa(copaY + 3));
    elipse(cx, copaY, 14, 4, colorCopa(copaY));
  }

  // Motas de algodón que caen de la ceiba
  function dibujarAlgodon(cuadro) {
    const { x: cx, copaY } = CEIBA;
    const caida = ESCENARIO.horizonte + 1 - copaY - 6;
    for (let i = 0; i < 3; i += 1) {
      const y = copaY + 6 + ((cuadro * .15 + i * 11) % caida);
      const x = cx - 8 + i * 8 + Math.sin(cuadro * .08 + i * 2) * 3;
      punto(x, y, paleta.algodon);
    }
  }

  function dibujarAves(cuadro) {
    const ALETEO_ARRIBA = [[-2, 0], [-1, -1], [0, 0], [1, -1], [2, 0]];
    const ALETEO_ABAJO = [[-2, -1], [-1, 0], [0, 0], [1, 0], [2, -1]];
    [{ desfase: 0, y: 17 }, { desfase: 9, y: 20 }].forEach(({ desfase, y }) => {
      const x = ((cuadro * .5 + desfase) % (anchoPaisaje + 60)) - 10;
      const forma = (cuadro + desfase) % 6 < 3 ? ALETEO_ARRIBA : ALETEO_ABAJO;
      forma.forEach(([dx, dy]) => punto(x + dx, y + dy + Math.sin(cuadro * .1 + desfase), paleta.ave));
    });
  }

  const ESTRELLAS = [[8, 4], [27, 9], [40, 3], [53, 12], [70, 5], [79, 15], [99, 20], [34, 17]];

  function dibujarEstrellas(cuadro) {
    ESTRELLAS.forEach(([x, y], indice) => {
      if ((cuadro + indice * 3) % 10 < 7) punto(x, y, COLORES_PAISAJE.nieve);
    });
  }

  function dibujarLuciernagas(cuadro) {
    for (let i = 0; i < 5; i += 1) {
      if ((cuadro + i * 5) % 12 < 4) continue; // parpadean
      const x = 12 + i * 21 + Math.sin(cuadro * .07 + i * 1.7) * 6;
      const y = ESCENARIO.horizonte + 4 + (i % 3) * 4 + Math.sin(cuadro * .11 + i) * 2;
      punto(x, y, LUCIERNAGA);
    }
  }

  function mostrarHora() {
    const pasos = Math.floor(hora * 6); // el reloj avanza de 10 en 10 minutos
    const texto = `${String(Math.floor(pasos / 6)).padStart(2, '0')}:${pasos % 6}0`;
    if (texto === relojMostrado) return;
    relojMostrado = texto;
    ui.reloj.textContent = texto;
  }

  function dibujarPaisaje() {
    // Avanza el reloj del día. Si la pestaña estuvo oculta no hay salto.
    const ahora = performance.now();
    const delta = Math.min(ahora - ultimoTic, 500);
    ultimoTic = ahora;
    const velocidad = turbo && estado?.fase === 'vivo' ? TURBO : 1;
    hora = (hora + delta * velocidad * 24 / DIA.duracionMs) % 24;

    const { altura, lado, luz, ocaso } = luzDelDia();
    actualizarPaleta(luz, ocaso);
    // Con "reducir movimiento" el día sigue pasando, pero nubes, aves y brillos quedan quietos
    const cuadro = sinMovimiento.matches ? 0 : cuadroPaisaje;
    const durmiendo = estado?.reaccion === 'dormir';

    pincel.drawImage(capaCielo, 0, 0);
    if (durmiendo || luz < .35) dibujarEstrellas(cuadro);
    dibujarLuna(altura, lado);
    if (!durmiendo) dibujarSol(cuadro, altura, lado);
    dibujarNubes(cuadro);
    if (luz > .6) dibujarAves(cuadro);
    pincel.drawImage(capaTierra, 0, 0);
    dibujarAlgodon(cuadro);
    if (luz < .3) dibujarLuciernagas(cuadro);
    mostrarHora();
    cuadroPaisaje += 1;
  }

  dibujarPaisaje();
  setInterval(dibujarPaisaje, ESCENARIO.cuadroMs);

  /* ===== Controles ===== */
  ui.botones.forEach((boton) => {
    boton.addEventListener('click', () => actuar(boton.dataset.accion));
  });
  ui.reiniciar.addEventListener('click', reiniciar);

  document.addEventListener('keydown', (evento) => {
    if (evento.repeat || evento.ctrlKey || evento.metaKey || evento.altKey) return;
    const tecla = evento.key.toLowerCase();
    if (estado.fase === 'eleccion' && /^[1-9]$/.test(tecla)) {
      elegirEspecie(Number(tecla) - 1);
    } else if (TECLAS[tecla]) {
      actuar(TECLAS[tecla]);
    } else if (tecla === 'r' && estado.fase === 'muerto') {
      reiniciar();
    } else if (tecla === 'd' && estado.fase === 'vivo') {
      turbo = !turbo;
      programarTemporizadores();
      render();
    } else if (tecla === 'm') {
      silencio = !silencio;
      render();
    }
  });

  dibujarEleccion();
  nuevaPartida();
})();
</script>
</body>
</html>
